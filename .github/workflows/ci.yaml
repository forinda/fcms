# CI for forinda-cms.
#
# One job running one command. `pnpm verify` is what a contributor runs before
# pushing, so CI failing means the same thing locally — no CI-only step to
# discover after the fact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the previous run. Nothing here is a deploy, so an
# in-flight run for a superseded commit is only burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The database tests skip themselves when DATABASE_URL is unset, which keeps
    # `pnpm verify` runnable on a laptop with no Postgres. That would make them
    # skip silently in CI too — so CI supplies one, and the guarantees the
    # dossier rests on (undo, the destructive gate, site scoping) are actually
    # exercised on every pull request rather than only when someone remembers.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: forinda_cms
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The suites read this too — `.env.test` supplies a default and an
      # exported value wins, so CI points both at the test database and migrates
      # it below.
      DATABASE_URL: postgres://ci:ci@localhost:5432/forinda_cms_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` so a PR that changed a dependency without updating
      # the lockfile fails here rather than resolving something different from
      # what anyone reviewed. The supply-chain settings in pnpm-workspace.yaml
      # (doc 09 §1) apply on top: build scripts run only for allowlisted
      # packages, and `minimumReleaseAge` quarantines brand-new releases.
      - run: pnpm install --frozen-lockfile

      - name: create the test database
        run: PGPASSWORD=ci psql -h localhost -U ci -d forinda_cms -c 'CREATE DATABASE forinda_cms_test'

      # Without this the database suites silently skip, and the guarantees they
      # cover go unchecked on every pull request.
      - name: migrate
        run: pnpm --filter @forinda-cms/db db:migrate

      - run: pnpm verify

  # The salon spec is ADR 0007 test 1's artifact and the fixture several test
  # suites run against. Checking that the CLI still validates and renders it
  # catches a regression that unit tests would not: the language losing the
  # ability to express a real business.
  salon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An absolute path: `--filter ... exec` runs with the package as its working
      # directory, so `examples/salon` resolved to `packages/cli/examples/salon`
      # and this job failed with "no site.yaml" on every run.
      - name: validate the reference spec
        run: pnpm --filter @forinda/fcms-cli exec tsx src/bin.ts validate "$GITHUB_WORKSPACE/examples/salon"
        env:
          NO_COLOR: '1'

      # What is published is a bundle, not this source tree, and the two can
      # break apart: an import the bundler cannot resolve, a dependency that
      # should have been external, a shebang landing on line two. Building and
      # running it here means that fails a pull request rather than a release.
      - name: the published bundle runs
        run: |
          pnpm --filter @forinda/fcms-cli build
          node packages/cli/dist/fcms.mjs validate "$GITHUB_WORKSPACE/examples/salon"
        env:
          NO_COLOR: '1'
