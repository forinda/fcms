# The image `install/compose.yaml` pulls.
#
# Phase 0b's install row (ADR 0002) says *published image*, and a compose file
# pointing at `ghcr.io/forinda/fcms:latest` is a promise until something
# publishes it. This is that something.
#
# Two triggers, deliberately different:
#
#   - a push to `main` republishes `:edge`, so the install path is exercised on
#     every merge rather than discovered broken at the first release;
#   - a `v`-less CalVer tag (`2026.3`, `2026.3.1` — ADR 0012) publishes the
#     tags a self-hoster actually pins: the full version, the year, and
#     `:latest`.
name: Release

on:
  push:
    branches: [main]
    tags: ['20[0-9][0-9].*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: doc 14's target is a small VPS, and the cheap
      # ones are increasingly ARM. An amd64-only image is one someone discovers
      # is wrong at `docker compose up`, after they have already committed.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Derived from the repository, not named. A ghcr package belongs to
          # the repository that first pushed it, and `GITHUB_TOKEN` from a
          # different one cannot write to it — pushing `forinda-cms` from the
          # `fcms` repository failed with `denied: permission_denied:
          # write_package`. Deriving it means the image follows the source
          # wherever it lives, with no package permission to grant by hand.
          images: ghcr.io/${{ github.repository }}
          # `2026.3.1` also publishes `2026.3` and `2026`, so an operator can
          # follow a release line or a year and still get its fixes. `latest`
          # moves only on a tag — never on a merge to main, which is what
          # `:edge` is for.
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=^(20\d\d\.\d+)\.,group=1,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=^(20\d\d)\.,group=1,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reused across runs so a merge that changed no dependency does not
          # reinstall the workspace on two architectures.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The same tag publishes the npm distributable (ADR 0046, ADR 0047), so a
  # release is one act rather than two that can disagree about what `2026.3`
  # means. Never on a merge to `main`: `:edge` is a moving image, and npm has
  # no such thing — a version published there is permanent.
  npm:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Three packages, one number: `@forinda/fcms-core` is the server,
      # `@forinda/fcms-cli` is the client that talks to it, and
      # `@forinda/fcms-mcp` is the same client for an agent. A user pairing
      # them should not have to read a compatibility table.
      #
      # `fail-fast: false` because the publishes are independent. One failing
      # must not cancel the others half-way through, which would leave a
      # release that exists on npm under one name and not the rest.
      fail-fast: false
      matrix:
        include:
          - package: "@forinda/fcms-core"
            directory: packages/server
          - package: "@forinda/fcms-cli"
            directory: packages/cli
          - package: "@forinda/fcms-mcp"
            directory: packages/mcp

    # `id-token: write` is npm trusted publishing (OIDC): npm verifies this
    # workflow's identity against a rule registered on the package, so there is
    # no NPM_TOKEN to leak or rotate.
    # https://docs.npmjs.com/trusted-publishers/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The admin application and the server, in that order: the packer copies
      # both, and a missing one fails loudly rather than publishing half a
      # product. The CLI needs none of it — its `prepack` bundles itself from
      # source — so it does not wait for a build it will not use.
      - if: matrix.directory == 'packages/server'
        run: pnpm build

      # The tag is `YYYY.N.P` rather than `YYYY.N` because npm will not take
      # anything short of full semver: `npm version 2026.1` fails outright with
      # `Invalid version: 2026.1`, after the image has already been pushed.
      - name: Version from the tag
        working-directory: ${{ matrix.directory }}
        run: |
          npm version "${GITHUB_REF_NAME}" --no-git-tag-version --allow-same-version
          echo "publishing ${{ matrix.package }}@${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        working-directory: ${{ matrix.directory }}
        # `pnpm publish`, not `npm publish`: both manifests depend on the
        # workspace catalog, and only pnpm resolves `catalog:` into real ranges
        # when it packs. npm would publish the word "catalog:" as a version and
        # every install of it would fail.
        #
        # `prepack` builds what is published — the server assembles its
        # directory, the CLI bundles itself — and either one refuses to include
        # a sourcemap (ADR 0047 §3, ADR 0048 §5).
        run: pnpm publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # The changelog, and the only place a human reads one.
  #
  # A CHANGELOG.md would have to be committed *after* the tag it describes,
  # which means either a commit nobody reviewed on top of a release or a file
  # that is always one release stale. The release page has neither problem, and
  # it is where the tag already points.
  #
  # Last, and after both publishes: notes that announce a version npm does not
  # have are worse than notes that arrive a minute late.
  notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [image, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # `fetch-depth: 0` for the tags and the history: the notes are the commits
      # between this tag and the one before it, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish the release notes
        run: |
          node scripts/notes.mjs "${GITHUB_REF_NAME}" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
