key: book
path: /book
title: Book an appointment
blocks:
  - type: section
    style: { padding: { y: xl, x: lg }, width: narrow }
    children:
      - type: heading
        attrs: { text: Book an appointment, level: 1 }
flows:
  - key: booking
    steps:
      - key: service
        label: Choose a service
        selects: { from: service, as: service }
        blocks:
          - type: list
            style: { cols: { base: 1, md: 2 }, gap: md }
            data:
              from: service
              where:
                - { field: active, op: eq, value: true }
              limit: 20
            item:
              - type: card
                style: { padding: md, border: hairline, radius: md }
                attrs: { heading: "{{ item.name }}", body: "{{ item.price | currency }}" }

      - key: stylist
        label: Choose a stylist
        requires: [service]
        selects: { from: staff, as: stylist }
        blocks:
          - type: list
            style: { cols: { base: 2, md: 4 }, gap: md }
            data:
              from: staff
              where:
                - { field: active, op: eq, value: true }
              limit: 8
            item:
              - type: card
                attrs: { heading: "{{ item.name }}", body: "{{ item.role }}" }

      - key: time
        label: Pick a time
        requires: [stylist]
        selects: { from: availability, as: slot }
        blocks:
          - type: list
            style: { cols: { base: 2, md: 4 }, gap: sm }
            data:
              from: availability
              sort: { field: startsAt, dir: asc }
              limit: 40
            item:
              - type: card
                style: { padding: sm, border: hairline, radius: sm }
                attrs: { heading: "{{ item.startsAt | time }}", body: "{{ item.staff }}" }

      - key: details
        label: Your details
        requires: [time]
        blocks:
          # No children: the inputs are generated from the booking type's declared
          # fields (ADR 0014, decision 5), so the form cannot drift from the model.
          - type: form
            attrs: { for: booking, submitLabel: Confirm booking }

    onComplete:
      - { action: booking-create }
      - { action: sms-send, params: { template: booking-confirmed } }
