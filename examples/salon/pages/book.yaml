key: book
path: /book
title: Book an appointment
blocks:
  - type: section
    style: { padding: { y: xl, x: lg }, width: narrow }
    children:
      - type: heading
        attrs: { text: Book an appointment, level: 1 }
flows:
  - key: booking
    steps:
      - key: service
        label: Choose a service
        selects: { from: service, as: service }
        blocks:
          - type: list
            style: { cols: { base: 1, md: 2 }, gap: md }
            data:
              from: service
              where:
                - { field: active, op: eq, value: true }
              limit: 20
            item:
              - type: card
                style: { padding: md, border: hairline, radius: md }
                attrs: { heading: "{{ item.name }}", body: "{{ item.price | currency }}" }

      - key: stylist
        label: Choose a stylist
        requires: [service]
        selects: { from: staff, as: stylist }
        blocks:
          - type: list
            style: { cols: { base: 2, md: 4 }, gap: md }
            data:
              from: staff
              where:
                - { field: active, op: eq, value: true }
              limit: 8
            item:
              - type: card
                attrs: { heading: "{{ item.name }}", body: "{{ item.role }}" }

      - key: time
        label: Pick a time
        requires: [stylist]
        # `as` names the field it fills on the booking (ADR 0028 §3): the
        # chosen slot's start time becomes `startsAt`.
        selects: { from: availability, as: startsAt }
        blocks:
          - type: list
            style: { cols: { base: 2, md: 4 }, gap: sm }
            data:
              from: availability
              sort: { field: startsAt, dir: asc }
              limit: 40
            item:
              - type: card
                style: { padding: sm, border: hairline, radius: sm }
                attrs: { heading: "{{ item.startsAt | time }}", body: "{{ item.staff }}" }

      - key: details
        label: Your details
        requires: [time]
        blocks:
          # No children: the inputs are generated from the booking type's declared
          # fields (ADR 0014, decision 5), so the form cannot drift from the model.
          - type: form
            attrs: { for: booking, submitLabel: Confirm booking }

    # Named in the same vocabulary `logic` uses (ADR 0024): a flow's completion
    # hands to the same action registry. The flow runtime does not exist yet, so
    # nothing here runs — what it must not do is name actions that will never
    # exist, which is what `booking-create` and `sms-send` were.
    onComplete:
      - { action: entry.transition, params: { to: confirmed } }
