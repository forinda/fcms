key: confirm-booking
label: Confirm a booking once the deposit is paid
# The sentence ADR 0024 §6 exists for. `payment.succeeded` fires only from a
# payment the platform confirmed with the provider — never from a callback body
# — so a stranger posting JSON cannot confirm anybody's booking.
trigger: { on: payment.succeeded, type: booking }
steps:
  - action: entry.transition
    params: { to: confirmed }
