key: staff
label: Stylist
labelPlural: Stylists
titleField: name
note: >-
  Working hours drive the availability generator. A stylist with no hours
  simply produces no slots, which is the safe direction to fail in.
fields:
  - { name: slug, label: Slug, type: text, required: true, unique: true, filterable: true }
  - { name: name, label: Name, type: text, required: true }
  - { name: role, label: Role, type: text }
  - { name: photo, label: Photo, type: asset, accept: image }
  - { name: workingHours, label: Working hours, type: hours }
  - { name: active, label: Taking bookings, type: boolean, filterable: true }
