key: property
label: Property
labelPlural: Properties
titleField: name
publishable: true
permalink: "/stay/{{ entry.slug }}"
jsonld:
  type: LocalBusiness
  properties: { name: name, description: blurb }
fields:
  - name: name
    label: Name
    type: text
    required: true
    unique: false
    filterable: false
  - name: blurb
    label: Summary
    type: text
    required: false
    unique: false
    filterable: false
  - name: description
    label: Description
    type: richtext
    required: false
    unique: false
    filterable: false
  - name: city
    label: City
    type: reference
    required: true
    unique: false
    filterable: true
    to: city
    many: false
  - name: address
    label: Address
    type: text
    required: false
    unique: false
    filterable: false
  - name: location
    label: Where
    type: geo
    required: false
    unique: false
    filterable: false
  - name: photo
    label: Main photo
    type: asset
    required: false
    unique: false
    filterable: false
    accept: image
  - name: stars
    label: Star rating
    type: number
    required: false
    unique: false
    filterable: true
    min: 1
    max: 5
  - name: kind
    label: Property type
    type: select
    required: false
    unique: false
    filterable: true
    options:
      - { value: hotel, label: Hotel }
      - { value: apartment, label: Apartment }
      - { value: guesthouse, label: Guesthouse }
      - { value: hostel, label: Hostel }
      - { value: villa, label: Villa }
  - name: amenities
    label: Amenities
    type: reference
    required: false
    unique: false
    filterable: false
    to: amenity
    many: true
  - name: freeCancellation
    label: Free cancellation
    type: boolean
    required: false
    unique: false
    filterable: true
  - name: breakfastIncluded
    label: Breakfast included
    type: boolean
    required: false
    unique: false
    filterable: true
  - name: score
    label: Guest score
    type: aggregate
    required: false
    unique: false
    filterable: true
    of: review
    on: property
    field: score
    fn: avg
    precision: 1
  - name: reviewCount
    label: Reviews
    type: aggregate
    required: false
    unique: false
    filterable: false
    of: review
    on: property
    fn: count
    precision: 1
  - name: priceFrom
    label: From
    type: aggregate
    required: false
    unique: false
    filterable: true
    of: room
    on: property
    field: price
    fn: min
    precision: 1
