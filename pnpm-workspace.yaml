# `apps/*` are the deployables, `packages/*` the libraries they share. The engine
# moved out of the repo root when the marketing site arrived to sit beside it,
# which is the condition research/09-packaging.md set for the move.
packages:
  - 'apps/*'
  - 'packages/*'

# One version per dependency, for the whole workspace (pnpm catalogs).
#
# Eight manifests each naming their own range is eight chances to drift, and
# two versions of a framework in one install is a class of bug that reads as
# nonsense at runtime. `catalog:` in a package.json means "whatever this says",
# so an upgrade is one edit here.
catalog:
  '@anthropic-ai/sdk': ^0.71.0
  astro: ^6.0.0
  '@forinda/kickjs': ^8.3.1
  '@forinda/kickjs-cli': ^8.1.5
  '@forinda/kickjs-schema': ^0.1.4
  '@forinda/kickjs-swagger': ^7.2.1
  '@forinda/kickjs-testing': ^8.0.0
  '@modelcontextprotocol/sdk': ^1.30.0
  multer: ^2.0.0
  '@types/multer': ^2.0.0
  '@forinda/kickjs-vite': ^8.0.0
  '@node-rs/argon2': ^2.2.0
  '@swc/core': ^1.15.21
  '@types/express': ^5.0.6
  '@types/node': ^25.0.0
  '@types/supertest': ^7.2.1
  commander: ^15.0.0
  dotenv: ^17.3.1
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  express: ^5.1.0
  oxfmt: ^0.65.0
  oxlint: ^1.80.0
  postgres: ^3.4.9
  reflect-metadata: ^0.2.2
  supertest: ^7.2.2
  tsx: ^4.23.13
  typescript: ^7.0.2
  unplugin-swc: ^1.5.9
  uuidv7: ^1.2.1
  vite: ^8.0.3
  vitest: ^4.1.2
  yaml: ^2.8.1
  zod: ^4.3.6

# Build-script allowlist (doc 09 §1 — supply-chain hardening).
# Add a package here ONLY after reviewing what its install script does, and say
# what it does. An unexplained entry is the same as no allowlist.
allowBuilds:
  # Analytics/telemetry postinstall. Opt-out; we do not want it.
  '@scarf/scarf': false
  # Native binary download for the SWC compiler. Required by kickjs.
  '@swc/core': true
  # Native binary download for the esbuild bundler. Required by tsx, which runs
  # the CLI in development.
  esbuild: true
  # Astro's image pipeline. Off: the marketing site ships its own optimised
  # assets, so nothing imports `astro:assets`, and a native binary download for
  # a feature nobody uses is install weight and supply-chain surface for free.
  # Flip to true — and say so here — the day a page needs `<Image>`.
  sharp: false
