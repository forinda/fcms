# The app still lives at the repo root; `packages/*` holds the shared libraries.
# It moves to `apps/engine` when there is a second app to sit beside it
# (research/09-packaging.md) — not before, because the move is cheap and doing it
# now buys nothing.
packages:
  - 'packages/*'

# Build-script allowlist (doc 09 §1 — supply-chain hardening).
# Add a package here ONLY after reviewing what its install script does, and say
# what it does. An unexplained entry is the same as no allowlist.
allowBuilds:
  # Analytics/telemetry postinstall. Opt-out; we do not want it.
  '@scarf/scarf': false
  # Native binary download for the SWC compiler. Required by kickjs.
  '@swc/core': true
  # Native binary download for the esbuild bundler. Required by tsx, which runs
  # the CLI in development.
  esbuild: true
